name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SoundBoost-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SoundBoost.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SoundBoost.apk \
            --title "SoundBoost (ล่าสุด)" \
            --notes "กด SoundBoost.apk เพื่อดาวน์โหลด แล้วเปิดไฟล์เพื่อติดตั้ง"
